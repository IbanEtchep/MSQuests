name: MSQuests
version: '1.0'
main: com.github.ibanetchep.msquests.bukkit.BukkitQuestsPlugin
api-version: '1.21'
folia-supported: true
authors:
  - ibanetchep

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
    zMenu:
      load: BEFORE
      required: false
    # Optional: with it, menus, the editor and the other modules' actions; without it, the quests
    # run on MSQuests' own copy of its runtime (ARCHITECTURE.md, Integration Artisan).
    Artisan:
      load: BEFORE
      required: false