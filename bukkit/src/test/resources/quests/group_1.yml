key: group_1
name: "groupe 1"
description: "Description du groupe"
max_active: 3
max_per_period: 10
reset_cron: "0 0 * * *"
start_at: "2024-01-01T00:00:00Z"
end_at: "2025-12-31T23:59:59Z"
actor_type: "PLAYER"

actions:
  quest_start:
    - type: message
      message: |-
        <#2ecc71>You have started the quest %quest_name%.
        Objectives : %objectives%
      objective_template: <newline>   - %objective_name%
    - type: title
      title: <#FFD166>Quest started
      subtitle: '%quest_name% %quest_description%'
    - type: action_bar
      message: <#FFD166>Quest %quest_name% started!
  quest_complete:
    - type: message
      message: |-
        <#2ecc71>You have completed the quest %quest_name%.
        Objectives : %objectives%
      objective: <newline>   - %objective_name%
    - type: title
      title: <#2ecc71>Quest completed
      subtitle: '%quest_name% %quest_description%'
  objective_progress:
    - type: boss_bar
      message: '%objective_name% - %objective_progress%'
  objective_complete:
    - type: boss_bar
      message: '<green>%objective_name% - %objective_progress%</green>'

quests:
  - key: quest_1
    name: "First Quest"
    description: "This is the first quest"
    duration: 120
    rewards:
      - type: "command"
        name: "Command Reward"
        command: "give %actor_name% diamond 1"
      - type: "give_item"
        name: "Item Reward"
        material: "DIAMOND"
        amount: 10
    stages:
      - key: stage_1
        name: "Premier stage"
        flow: PARALLEL
        objectives:
          - key: objective_1
            type: "block_break"
            material: "STONE"
            amount: 10
            conditions:
              - type: placeholder
                placeholder: "%player_world%"
                action: EQUALS_STRING
                value: "world"
          - key: objective_2
            type: "kill_entity"
            entity_type: "ZOMBIE"
            amount: 5
            conditions:
              - type: placeholder
                placeholder: "%player_world%"
                action: EQUALS_STRING
                value: "world_nether"
      - key: stage_2
        name: "Deuxième stage"
        flow: PARALLEL
        objectives:
          - key: stage_2_1
            type: "block_break"
            material: "DIRT"
            amount: 5

  - key: quest_2
    name: "Second Quest"
    description: "This is the second quest"
    duration: 180
    rewards:
      - type: "command"
        name: "Command Reward"
        command: "give %actor_name% dirt 5"
      - type: "give_item"
        name: "Item Reward"
        material: "DIRT"
        amount: 1
    stages:
      - key: stage_1
        name: "Stage unique"
        flow: PARALLEL
        objectives:
          - key: objective_1
            type: "kill_entity"
            entity_type: "PIG"
            amount: 1
