plugins {
    id 'java'
    id 'io.github.goooler.shadow'
}

repositories {
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven { url = 'https://repo.groupez.dev/releases' }
}

dependencies {
    implementation(project(":core"))
    implementation(project(":database"))

    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly('me.clip:placeholderapi:2.11.6')
    compileOnly("fr.maxlego08.menu:zmenu-api:1.1.1.0")
    // Artisan integration — provided at runtime by the Artisan plugin, never shaded.
    // Build the artifact locally with: cd <Artisan>/plugin && ./gradlew publishToMavenLocal
    compileOnly("net.artisanmc:artisan-core-api:1.0.0-SNAPSHOT")
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.2.20")
    implementation("com.tcoded:FoliaLib:0.5.1")
    implementation("io.github.revxrsal:lamp.common:4.0.0-rc.16")
    implementation("io.github.revxrsal:lamp.bukkit:4.0.0-rc.16")
    implementation("io.github.revxrsal:lamp.brigadier:4.0.0-rc.16")
    implementation("dev.dejvokep:boosted-yaml:1.3.7")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.20.0")
    implementation("com.fasterxml.jackson.core:jackson-core:2.20.0")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.0")
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.0")
    implementation(group: 'com.networknt', name: 'json-schema-validator', version: '1.5.9')

    testImplementation("com.tcoded:FoliaLib:0.5.1")
    testImplementation("io.github.revxrsal:lamp.common:4.0.0-rc.16")
    testImplementation("io.github.revxrsal:lamp.bukkit:4.0.0-rc.16")
    testImplementation("io.github.revxrsal:lamp.brigadier:4.0.0-rc.16")
    testImplementation("dev.dejvokep:boosted-yaml:1.3.7")
    testImplementation("com.fasterxml.jackson.core:jackson-databind:2.20.0")
    testImplementation("com.fasterxml.jackson.core:jackson-core:2.20.0")
    testImplementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.0")
    testImplementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.0")
    testImplementation(group: 'com.networknt', name: 'json-schema-validator', version: '1.5.9')
    testImplementation('com.cronutils:cron-utils:9.2.1')
    testImplementation("org.jdbi:jdbi3-core:3.49.6")
    testImplementation("com.zaxxer:HikariCP:5.1.0")
    testImplementation("com.h2database:h2:2.3.232")
    testImplementation("org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.41.0")
    testImplementation("org.mockito:mockito-core:5.14.2")
    testImplementation("net.artisanmc:artisan-core-api:1.0.0-SNAPSHOT")
    testImplementation("org.jetbrains.kotlin:kotlin-stdlib:2.2.20")
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveFileName = "msquests-bukkit-${version}.jar"
    archiveClassifier.set('')
    relocate 'com.tcoded.folialib', 'com.github.ibanetchep.msquests.libs.folialib'
}

// The shaded jar shares its coordinates with the plain jar; publish only the latter, which is
// what integration plugins compile against.
components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }


tasks.register('copyPlugin', Copy) {
    from shadowJar.archiveFile
    into "../docker/plugins"

    from('src/main/resources/config.yml') {
        into "./MSQuests"
    }
}

build {
    dependsOn shadowJar
    finalizedBy(tasks.named("copyPlugin"))
}