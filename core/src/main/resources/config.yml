config_version: 3

language: en_EN

# Where quests and their progress are read from. Read at startup only: restart after a change.
#   legacy  — quests/*.yml and the msquests_* tables, as before.
#   artisan — the quest_group Documents of every Artisan project (quest_groups/) and the artisan_quests_* tables.
# Run /msquests migrate (dry run), then /msquests migrate --confirm, before switching to artisan:
# the saved progress is copied into artisan_quests_* at the first start in that mode.
content_source: legacy

# Database of the plugin. Read only when plugins/Artisan/environment.yml does not exist
# (the suite then shares that file's database), or with `own: true` to keep this section anyway.
# H2 writes plugins/MSQuests/database/suite.mv.db.
database:
  own: false
  type: h2 # Options: h2, mysql, mariadb
  host: mariadb
  port: 3306
  name: database
  user: username
  password: password
  pool-size: 4

actor_type:
  player:
    start_actions:
      - type: message
        message_key: player_quest.started.message.body
        objective_key: player_quest.started.message.objective
      - type: title
        title_key: player_quest.started.title.title
        subtitle_key: player_quest.started.title.subtitle
      - type: action_bar
        message_key: player_quest.started.action_bar
    progress_actions:
      - type: action_bar
        message_key: player_quest.progress.action_bar
    complete_actions:
      - type: message
        message_key: player_quest.complete.message.body
      - type: title
        title_key: player_quest.complete.title.title
        subtitle_key: player_quest.complete.title.subtitle
  global:
    start_actions:
      - type: message
        message_key: global_quest.started.message.body
        objective_key: global_quest.started.message.objective
      - type: title
        title_key: global_quest.started.title.title
        subtitle_key: global_quest.started.title.subtitle
      - type: action_bar
        message_key: global_quest.started.action_bar
    progress_actions:
      - type: action_bar
        message_key: global_quest.progress.action_bar
    complete_actions:
      - type: message
        message_key: global_quest.complete.message.body
      - type: title
        title_key: global_quest.complete.title.title
        subtitle_key: global_quest.complete.title.subtitle

tracking:
  bossbar:
    enabled: false
    message: '%objective_name% - %objective_progress%'
    color: WHITE
    style: PROGRESS
    show_progress: true

placeholders:
  cycle_duration_seconds: 5

deliver_item:
  # Also take the items from shulker boxes carried in the inventory, once the inventory itself is empty.
  include_shulker_boxes: true
